# Homelab – segmentovaná síť
# subnets.conf
# NEUPRAVOVAT RUČNĚ pokud víš co děláš

# ============================================================
# VLAN20 - DHCP servery (management subnet)
# Prázdná deklarace - dhcpd nepřiděluje adresy na tomto subnetu
# ============================================================
subnet 172.22.20.0 netmask 255.255.255.0 {
}

# ============================================================
# VLAN40 - wifi guest
# Pool: 172.22.40.1-253, lease 1h, bez domain name
# ============================================================
subnet 172.22.40.0 netmask 255.255.255.0 {
    pool {
        failover peer "dhcp-failover";
        range 172.22.40.1 172.22.40.253;
    }
    option routers             172.22.40.254;
    option domain-name-servers 172.22.21.1, 172.22.21.2;
    option subnet-mask         255.255.255.0;
    default-lease-time         3600;
    max-lease-time             3600;
}

# ============================================================
# VLAN41 - images
# Pool: 172.22.41.1-253, lease 8h
# ============================================================
subnet 172.22.41.0 netmask 255.255.255.0 {
    pool {
        failover peer "dhcp-failover";
        range 172.22.41.1 172.22.41.253;
    }
    option routers             172.22.41.254;
    option domain-name-servers 172.22.21.1, 172.22.21.2;
    option domain-name         "lab.local";
    option subnet-mask         255.255.255.0;
    default-lease-time         28800;
    max-lease-time             28800;
}

# ============================================================
# VLAN42 - trusted
# Pouze rezervace - neznámá zařízení nedostanou IP
# lease 24h
# ============================================================
subnet 172.22.42.0 netmask 255.255.255.0 {
    deny unknown-clients;
    option routers             172.22.42.254;
    option domain-name-servers 172.22.21.1, 172.22.21.2;
    option domain-name         "lab.local";
    option subnet-mask         255.255.255.0;
    default-lease-time         86400;
    max-lease-time             86400;
}

